<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ま</title>
<style>
  html, body { margin:0; height:100%; background:#060a14; overflow:hidden; touch-action:none; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let w, h, dpr;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  w = Math.floor(window.innerWidth);
  h = Math.floor(window.innerHeight);
  canvas.width  = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();

// ---- タッチ（粒子を引き寄せ）
let touchActive = false;
let touchX = 0, touchY = 0;

canvas.addEventListener('pointerdown', (e)=>{
  touchActive = true;
  canvas.setPointerCapture?.(e.pointerId);
  touchX = e.clientX;
  touchY = e.clientY;
});
canvas.addEventListener('pointermove', (e)=>{
  if (!touchActive) return;
  touchX = e.clientX;
  touchY = e.clientY;
});
function endPointer(){
  touchActive = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

// ---- 沈み（呼吸）
let offsetY = 0;
let targetOffset = 0;

// ---- 時間
let time = 0;

// ---- 背景（夜の水中）
function drawBackground(){
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#04060c");
  grad.addColorStop(1, "#0b1730");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

// ---- 粒子
const particles = [];
function initParticles(){
  particles.length = 0;
  const n = Math.floor((w*h) / 350); // 密度（今の設定）

  for(let i=0;i<n;i++){
    particles.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: 0.3 + Math.random()*0.9,
      a: 0.08 + Math.random()*0.12,
      s: 0.12 + Math.random()*0.35,
      p: Math.random()*Math.PI*2,
      vx: (Math.random()-0.5) * 0.2,
      vy: (Math.random()-0.5) * 0.2
    });
  }
}
initParticles();

window.addEventListener('resize', () => { resize(); initParticles(); });

// ---- 吸い寄せパラメータ（粒子ループ外で一回だけ）
const ATTR = {
  R: 160,
  strength: 0.020,
  damping: 0.92,
  drift: 0.10 // 水中の自然漂い（強すぎたら 0.05）
};

function updateAndDrawMist(){
  ctx.globalCompositeOperation = "screen";

  const R = ATTR.R;
  const R2 = R*R;
  const strength = ATTR.strength;
  const damping = ATTR.damping;
  const drift = ATTR.drift;

  for (const pt of particles) {

    // --- 指へ吸い寄せ
    if (touchActive) {
      const dx = touchX - pt.x;
      const dy = touchY - pt.y;
      const dist2 = dx*dx + dy*dy;

      if (dist2 < R2) {
        const dist = Math.sqrt(dist2) + 0.0001;
        const falloff = 1 - (dist / R);   // 0..1
        const ux = dx / dist;
        const uy = dy / dist;

        pt.vx += ux * strength * falloff;
        pt.vy += uy * strength * falloff;
      }
    }

    // --- 減衰
    pt.vx *= damping;
    pt.vy *= damping;

    // --- 位置更新
    pt.x += pt.vx;
    pt.y += pt.vy;

    // --- ほんの少し自然漂い（縦方向）
    pt.y += pt.s * drift;

    // --- 画面外ラップ
    if (pt.x < -20) pt.x = w + 20;
    if (pt.x > w + 20) pt.x = -20;
    if (pt.y < -20) pt.y = h + 20;
    if (pt.y > h + 20) pt.y = -20;

    // --- 見た目ゆらぎ（微細）
    const nx = pt.x + Math.sin(time*0.00035 + pt.p) * 6;
    const ny = pt.y + Math.cos(time*0.00030 + pt.p) * 6;

    ctx.beginPath();
    ctx.fillStyle = `rgba(170,210,255,${pt.a})`;
    ctx.ellipse(nx, ny, pt.r, pt.r*1.8, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";

  // 薄い霧ベール
  ctx.fillStyle = "rgba(255,255,255,0.006)";
  ctx.fillRect(0, 0, w, h);
}

// ---- ループ
function loop(){
  time += 16;

  // ---- 自動呼吸サイクル（7秒 down / 4秒 up）
  const cycle = 11000;
  const downTime = 7000;
  const t = performance.now() % cycle;

  let p;
  if (t < downTime) {
    p = t / downTime; // 0→1
  } else {
    p = 1 - ((t - downTime) / (cycle - downTime)); // 1→0
  }

  // なめらか
  p = p * p * (3 - 2 * p);

  const maxDepth = 150;
  targetOffset = p * maxDepth;

  // 追従
  const follow = 0.12;
  offsetY += (targetOffset - offsetY) * follow;

  ctx.clearRect(0,0,w,h);

  ctx.save();

  // 横揺れ（足し算を忘れない）
  const sway =
    Math.sin(time * 0.0007) * (4 + p * 4) +
    Math.sin(time * 0.0013) * 2;

  ctx.translate(sway, offsetY * 0.30);

  drawBackground();
  updateAndDrawMist();

  ctx.restore();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
