<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ま</title>
<style>
  html, body { margin:0; height:100%; background:#060a14; overflow:hidden; touch-action:none; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let w, h, dpr;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  w = Math.floor(window.innerWidth);
  h = Math.floor(window.innerHeight);
  canvas.width  = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

// ---- 沈み（目標値方式）
let offsetY = 0;
let targetOffset = 0;

// ---- 入力
let down = false;
let lastX = 0, lastY = 0;

let time = 0;

let touchActive = false;
let touchX = 0, touchY = 0;

canvas.addEventListener('pointerdown', (e)=>{
  touchActive = true;
  canvas.setPointerCapture?.(e.pointerId);
  touchX = e.clientX;
  touchY = e.clientY;
});

canvas.addEventListener('pointermove', (e)=>{
  if (!touchActive) return;
  touchX = e.clientX;
  touchY = e.clientY;
});

function endPointer(){
  touchActive = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

function endPointer(){ down = false; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);



// ---- 背景（夜の水中）
function drawBackground(){
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#04060c");  // ほぼ黒
  grad.addColorStop(1, "#0b1730");  // 深い紺
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

// ---- 粒子（粗く・明るく）
const particles = [];
function initParticles(){
  particles.length = 0;

  // 粗い粒子にする：数は控えめでも「見える」
  const n = Math.floor((w*h) / 350); // 少なめ（粗さ）
  for(let i=0;i<n;i++){
    particles.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: 0.3 + Math.random()*0.9,   // 粒を大きく（粗い）
      a: 0.08 + Math.random()*0.12,  // かなり明るく
      s: 0.12 + Math.random()*0.35,   // 漂い
      p: Math.random()*Math.PI*2
      vx: (Math.random()-0.5) * 0.2,
      vy: (Math.random()-0.5) * 0.2,
      
    });
  }
}
initParticles();

function drawMist(){
  // 光る描画（重なるほど明るい）
  ctx.globalCompositeOperation = "screen";

  for (const pt of particles) {

    // ---- 指への吸い寄せパラメータ
const R = 160;           // 影響半径（px）
const R2 = R * R;
const strength = 0.020;  // 引力の強さ（強すぎたら 0.012 くらいへ）
const damping = 0.92;    // 減衰（0.88〜0.96で調整）

// 粒子の更新（吸い寄せ）
if (touchActive) {
  const dx = touchX - pt.x;
  const dy = touchY - pt.y;
  const dist2 = dx*dx + dy*dy;

  if (dist2 < R2) {
    const dist = Math.sqrt(dist2) + 0.0001;

    // 距離減衰（近いほど強い、遠いほど弱い）
    const falloff = 1 - (dist / R);

    // 正規化ベクトル（方向だけ）
    const ux = dx / dist;
    const uy = dy / dist;

    // 引力（指へ寄る）
    pt.vx += ux * strength * falloff;
    pt.vy += uy * strength * falloff;
  }
}

// 減衰（暴れ防止）
pt.vx *= damping;
pt.vy *= damping;

// 位置更新
pt.x += pt.vx;
pt.y += pt.vy;

// 既存の漂いも少しだけ残す（縦方向の水中感）
pt.y += pt.s * 0.15;

// 画面外に出たらラップ（反対側へ回す）
if (pt.x < -20) pt.x = w + 20;
if (pt.x > w + 20) pt.x = -20;
if (pt.y < -20) pt.y = h + 20;
if (pt.y > h + 20) pt.y = -20;

    const nx = pt.x + Math.sin(time*0.00035 + pt.p) * 6;
    const ny = pt.y + Math.cos(time*0.00030 + pt.p) * 6;

    ctx.beginPath();
    // 青白い光粒子
    ctx.fillStyle = `rgba(170,210,255,${pt.a})`;
    ctx.ellipse(nx, ny, pt.r, pt.r*1.8, 0, 0, Math.PI*2);
    ctx.fill();

    pt.y += pt.s;
    if (pt.y > h + 20) pt.y = -20;
  }

  // 合成を戻す
  ctx.globalCompositeOperation = "source-over";

  // 薄い霧ベール（濃すぎると粒子が死ぬ）
  ctx.fillStyle = "rgba(255,255,255,0.006)";
  ctx.fillRect(0, 0, w, h);
}

// ---- ループ
function loop(){
  time += 16;

// ---- 自動呼吸サイクル（7秒 down / 4秒 up）
const cycle = 11000;     // 11秒で1周
const downTime = 7000;   // 7秒で沈む
const t = performance.now() % cycle;

let p;
if (t < downTime) {
  p = t / downTime; // 0→1
} else {
  p = 1 - ((t - downTime) / (cycle - downTime)); // 1→0
}

// なめらかに（加減速）
p = p * p * (3 - 2 * p);

// 最大沈み（好み）
const maxDepth = 150; // 少し深くしても気持ちいい


targetOffset = p * maxDepth; // ←これだけ

  // 追従（反応を気持ちよく）
  const follow = 0.12;
  offsetY += (targetOffset - offsetY) * follow;

  moveEnergy *= 0.90;

  ctx.clearRect(0,0,w,h);

  ctx.save();
  // 横のゆらぎ（ゆっくり）
const sway =
  Math.sin(time * 0.0007) * (4 + p * 4);     // 大きめのゆらぎ
  Math.sin(time * 0.0013) * 2;      // 細かいゆらぎ

ctx.translate(sway, offsetY * 0.30);
  drawBackground();
  drawMist();
  ctx.restore();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
