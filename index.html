<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ま</title>
<style>
html, body { margin:0; height:100%; background:#060a14; overflow:hidden; touch-action:none; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let w, h, dpr;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

let touchActive = false;
let touchX = 0, touchY = 0;

canvas.addEventListener('pointerdown', e=>{
  touchActive = true;
  touchX = e.clientX;
  touchY = e.clientY;
});
canvas.addEventListener('pointermove', e=>{
  if(!touchActive) return;
  touchX = e.clientX;
  touchY = e.clientY;
});
canvas.addEventListener('pointerup', ()=> touchActive=false);
canvas.addEventListener('pointercancel', ()=> touchActive=false);
canvas.addEventListener('pointerleave', ()=> touchActive=false);

let offsetY = 0;
let time = 0;

function drawBackground(){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#04060c");
  grad.addColorStop(1,"#0b1730");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

const particles = [];
function initParticles(){
  particles.length = 0;
  const n = Math.floor((w*h)/350);
  for(let i=0;i<n;i++){
    const x = Math.random()*w;
    const y = Math.random()*h;
    particles.push({
      x,y,
      hx:x, hy:y,
      r:0.3+Math.random()*0.9,
      a:0.08+Math.random()*0.12,
      p:Math.random()*Math.PI*2,
      vx:(Math.random()-0.5)*0.2,
      vy:(Math.random()-0.5)*0.2
    });
  }
}
initParticles();

function updateParticles(){
  const R = 140;
  const R2 = R*R;
  const strength = 0.028;
  const damping = 0.95;

  for(const pt of particles){

    if(touchActive){
      const dx = touchX - pt.x;
      const dy = touchY - pt.y;
      const d2 = dx*dx+dy*dy;
      if(d2<R2){
        const d = Math.sqrt(d2)+0.0001;
        let falloff = 1-(d/R);
        falloff *= falloff;
        pt.vx += (dx/d)*strength*falloff;
        pt.vy += (dy/d)*strength*falloff;
      }
    }

    pt.vx*=damping;
    pt.vy*=damping;

    pt.vx += (pt.hx-pt.x)*0.0005;
    pt.vy += (pt.hy-pt.y)*0.0005;

    pt.x+=pt.vx;
    pt.y+=pt.vy;
  }
}

function drawParticles(){
  ctx.globalCompositeOperation="screen";
  for(const pt of particles){
    const nx = pt.x + Math.sin(time*0.00035+pt.p)*6;
    const ny = pt.y + Math.cos(time*0.00030+pt.p)*6;

    ctx.beginPath();
    ctx.fillStyle=`rgba(170,210,255,${pt.a})`;
    ctx.ellipse(nx,ny,pt.r,pt.r*1.8,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
}

function loop(){
  time+=16;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  drawBackground();

  const sway =
    Math.sin(time*0.0007)*4+
    Math.sin(time*0.0013)*2;

  ctx.save();
  ctx.translate(sway, offsetY*0.3);
  updateParticles();
  drawParticles();
  ctx.restore();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
