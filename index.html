<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ま</title>
<style>
  html, body { margin:0; height:100%; background:#060a14; overflow:hidden; touch-action:none; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let w, h, dpr;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  w = Math.floor(window.innerWidth);
  h = Math.floor(window.innerHeight);
  canvas.width  = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

// ---- 沈み（目標値方式）
let offsetY = 0;
let targetOffset = 0;

// ---- 入力
let down = false;
let lastX = 0, lastY = 0;
let moveEnergy = 0;
let time = 0;

canvas.addEventListener('pointerdown', (e)=>{
  down = true;
  canvas.setPointerCapture?.(e.pointerId);
  lastX = e.clientX; lastY = e.clientY;
});

canvas.addEventListener('pointermove', (e)=>{
  if (!down) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;

  const dist = Math.hypot(dx, dy);
  moveEnergy += dist * 2.2; // ← なぞりの効き（強め）
});

function endPointer(){ down = false; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

// ---- 背景（夜の水中）
function drawBackground(){
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#04060c");  // ほぼ黒
  grad.addColorStop(1, "#0b1730");  // 深い紺
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

// ---- 粒子（粗く・明るく）
const particles = [];
function initParticles(){
  particles.length = 0;

  // 粗い粒子にする：数は控えめでも「見える」
  const n = Math.floor((w*h) / 6000); // 少なめ（粗さ）
  for(let i=0;i<n;i++){
    particles.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: 2.0 + Math.random()*4.5,     // 粒を大きく（粗い）
      a: 0.18 + Math.random()*0.22,   // かなり明るく
      s: 0.12 + Math.random()*0.35,   // 漂い
      p: Math.random()*Math.PI*2
    });
  }
}
initParticles();

function drawMist(){
  // 光る描画（重なるほど明るい）
  ctx.globalCompositeOperation = "lighter";

  for (const pt of particles) {
    const nx = pt.x + Math.sin(time*0.00035 + pt.p) * 10;
    const ny = (pt.y + Math.cos(time*0.00030 + pt.p) * 10 + offsetY*0.25) % h;

    ctx.beginPath();
    // 青白い光粒子
    ctx.fillStyle = `rgba(180,210,255,${pt.a})`;
    ctx.arc(nx, ny, pt.r, 0, Math.PI*2);
    ctx.fill();

    pt.y += pt.s;
    if (pt.y > h + 20) pt.y = -20;
  }

  // 合成を戻す
  ctx.globalCompositeOperation = "source-over";

  // 薄い霧ベール（濃すぎると粒子が死ぬ）
  ctx.fillStyle = "rgba(255,255,255,0.006)";
  ctx.fillRect(0, 0, w, h);
}

// ---- ループ
function loop(){
  time += 16;

  // 押してる＋なぞりで沈む（控えめに）
  const baseSink = down ? 90 : 0;
  const moveSink = Math.min(300, moveEnergy) * 0.55;

  targetOffset = baseSink + moveSink;

  // 追従（反応を気持ちよく）
  const follow = 0.12;
  offsetY += (targetOffset - offsetY) * follow;

  moveEnergy *= 0.90;

  ctx.clearRect(0,0,w,h);

  ctx.save();
  ctx.translate(0, offsetY * 0.30); // 沈み演出
  drawBackground();
  drawMist();
  ctx.restore();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
