<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ま</title>
<style>
  html, body { margin:0; height:100%; background:#060a14; overflow:hidden; touch-action:none; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let w, h, dpr;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  w = Math.floor(window.innerWidth);
  h = Math.floor(window.innerHeight);
  canvas.width  = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();

// ---- タッチ（粒子を引き寄せ）
let touchActive = false;
let touchX = 0, touchY = 0;

canvas.addEventListener('pointerdown', (e)=>{
  touchActive = true;
  canvas.setPointerCapture?.(e.pointerId);
  touchX = e.clientX;
  touchY = e.clientY;
});
canvas.addEventListener('pointermove', (e)=>{
  if (!touchActive) return;
  touchX = e.clientX;
  touchY = e.clientY;
});

// ---- 粒子
const particles = [];

function burstOut(cx, cy){
  const R = 220;
  const R2 = R*R;
  const power = 1.2;

  for(const pt of particles){
    const dx = pt.x - cx;
    const dy = pt.y - cy;
    const d2 = dx*dx + dy*dy;
    if (d2 > R2) continue;

    const d = Math.sqrt(d2) + 0.0001;
    const falloff = 1 - (d / R);
    const ux = dx / d;
    const uy = dy / d;

    pt.vx += ux * power * falloff;
    pt.vy += uy * power * falloff;
  }
}

function endPointer(){
  if (touchActive) burstOut(touchX, touchY);
  touchActive = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

// ---- 呼吸（沈み）
let offsetY = 0;
let targetOffset = 0;

// ---- 時間
let time = 0;

// ---- 背景（固定）
function drawBackground(){
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#04060c");
  grad.addColorStop(1, "#0b1730");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function initParticles(){
  particles.length = 0;
  const n = Math.floor((w*h) / 350);

  for(let i=0;i<n;i++){
    const x = Math.random()*w;
    const y = Math.random()*h;
    particles.push({
      x, y,
      hx: x, hy: y,
      r: 0.3 + Math.random()*0.9,
      a: 0.08 + Math.random()*0.12,
      s: 0.12 + Math.random()*0.35,
      p: Math.random()*Math.PI*2,
      vx: (Math.random()-0.5) * 0.2,
      vy: (Math.random()-0.5) * 0.2
    });
  }
}
initParticles();

window.addEventListener('resize', () => {
  resize();
  initParticles();
});

// ---- 吸い寄せパラメータ
const ATTR = {
  R: 140,
  strength: 0.028,
  damping: 0.95,
  drift: 0.08,
  springTouch: 0.0003,
  springRelease: 0.006
};

function updateAndDrawMist(){
  ctx.globalCompositeOperation = "screen";

  const R = ATTR.R;
  const R2 = R*R;
  const strength = ATTR.strength;
  const damping = ATTR.damping;
  const drift = ATTR.drift;

  for (const pt of particles) {

    // 指へ吸い寄せ
    if (touchActive) {
      const dx = touchX - pt.x;
      const dy = touchY - pt.y;
      const dist2 = dx*dx + dy*dy;

      if (dist2 < R2) {
        const dist = Math.sqrt(dist2) + 0.0001;

        let falloff = 1 - (dist / R);
        falloff = falloff * falloff; // 中心ほど強い

        const ux = dx / dist;
        const uy = dy / dist;

        pt.vx += ux * strength * falloff;
        pt.vy += uy * strength * falloff;
      }
    }

    // 減衰
    pt.vx *= damping;
    pt.vy *= damping;

    // ホームへ戻る（タッチ中は弱く）
    const spring = touchActive ? ATTR.springTouch : ATTR.springRelease;
    pt.vx += (pt.hx - pt.x) * spring;
    pt.vy += (pt.hy - pt.y) * spring;

    // 位置更新
    pt.x += pt.vx;
    pt.y += pt.vy;

    // 自然漂い
    pt.y += pt.s * drift;

    // 画面外ラップ
    if (pt.x < -20) pt.x = w + 20;
    if (pt.x > w + 20) pt.x = -20;
    if (pt.y < -20) pt.y = h + 20;
    if (pt.y > h + 20) pt.y = -20;

    // 見た目ゆらぎ
    const nx = pt.x + Math.sin(time*0.00035 + pt.p) * 6;
    const ny = pt.y + Math.cos(time*0.00030 + pt.p) * 6;

    // 密度ブースト
    let boost = 0;
    if (touchActive) {
      const dx2 = touchX - pt.x;
      const dy2 = touchY - pt.y;
      const d = Math.sqrt(dx2*dx2 + dy2*dy2);
      const Rb = 180;
      if (d < Rb) boost = 1 - (d / Rb);
    }

    const a = Math.min(0.45, pt.a + boost * 0.28);
    const r = pt.r * (1 + boost * 0.45);

    ctx.beginPath();
    ctx.fillStyle = `rgba(170,210,255,${a})`;
    ctx.ellipse(nx, ny, r, r*1.8, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
} // ←★ここが抜けてた（重要）

// ---- ループ
function loop(){
  time += 16;

  // 毎フレーム transform をリセット（Safari対策）
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 7秒 down / 4秒 up
  const cycle = 11000;
  const downTime = 7000;
  const t = performance.now() % cycle;

  let p;
  if (t < downTime) p = t / downTime;
  else p = 1 - ((t - downTime) / (cycle - downTime));

  p = p * p * (3 - 2 * p);

  const maxDepth = 150;
  targetOffset = p * maxDepth;

  const follow = 0.12;
  offsetY += (targetOffset - offsetY) * follow;

  // クリア→背景固定
  ctx.clearRect(0, 0, w, h);
  drawBackground();

  // 横揺れ（波）
  const sway =
    Math.sin(time * 0.0007) * (4 + p * 4) +
    Math.sin(time * 0.0013) * 2;

  // 粒子だけ沈む＆揺れる
  ctx.save();
  ctx.translate(sway, offsetY * 0.30);
  updateAndDrawMist();
  ctx.restore();

  // ベールは固定（translateの外）
  ctx.fillStyle = "rgba(255,255,255,0.006)";
  ctx.fillRect(0, 0, w, h);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
