<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ま</title>
<style>
html, body { margin:0; height:100%; background:#060a14; overflow:hidden; touch-action:none; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let w, h, dpr;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

// ---- タッチ
let touchActive = false;
let touchX = 0, touchY = 0;

canvas.addEventListener('pointerdown', e=>{
  touchActive = true;
  touchX = e.clientX;
  touchY = e.clientY;
});
canvas.addEventListener('pointermove', e=>{
  if(!touchActive) return;
  touchX = e.clientX;
  touchY = e.clientY;
});
canvas.addEventListener('pointerup', ()=>{
  if(touchActive) burstOut(touchX, touchY);
  touchActive = false;
});
canvas.addEventListener('pointercancel', ()=> touchActive=false);
canvas.addEventListener('pointerleave', ()=> touchActive=false);

// ---- 状態
let offsetY = 0;
let time = 0;

// ---- 背景（固定）
function drawBackground(){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#04060c");
  grad.addColorStop(1,"#0b1730");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

// ---- 粒子
const particles = [];
function initParticles(){
  particles.length = 0;
  const n = Math.floor((w*h)/350);
  for(let i=0;i<n;i++){
    const x = Math.random()*w;
    const y = Math.random()*h;
    particles.push({
      x,y,
      hx:x, hy:y,
      r:0.3+Math.random()*0.9,
      a:0.08+Math.random()*0.12,
      p:Math.random()*Math.PI*2,
      vx:(Math.random()-0.5)*0.2,
      vy:(Math.random()-0.5)*0.2
    });
  }
}
initParticles();

function updateParticles(){
  const R = 140;
  const R2 = R*R;
  const strength = 0.028;
  const damping = 0.95;

  for(const pt of particles){

    if(touchActive){
      const dx = touchX - pt.x;
      const dy = touchY - pt.y;
      const d2 = dx*dx+dy*dy;
      if(d2<R2){
        const d = Math.sqrt(d2)+0.0001;
        let falloff = 1-(d/R);
        falloff *= falloff; // 中心だけ強く
        pt.vx += (dx/d)*strength*falloff;
        pt.vy += (dy/d)*strength*falloff;
      }
    }

    pt.vx*=damping;
    pt.vy*=damping;

    // ホームへ戻る（溜まりっぱなし防止）
    const spring = touchActive ? 0.0002 : 0.0008;
    pt.vx += (pt.hx-pt.x)*spring;
    pt.vy += (pt.hy-pt.y)*spring;

    pt.x+=pt.vx;
    pt.y+=pt.vy;

    // 画面外に出たら戻す（軽いラップ）
    if (pt.x < -20) pt.x = w + 20;
    if (pt.x > w + 20) pt.x = -20;
    if (pt.y < -20) pt.y = h + 20;
    if (pt.y > h + 20) pt.y = -20;
  }
}

function drawParticles(){
  ctx.globalCompositeOperation="screen";
  for(const pt of particles){
    const nx = pt.x + Math.sin(time*0.00035+pt.p)*6;
    const ny = pt.y + Math.cos(time*0.00030+pt.p)*6;

    // 密度ブースト（触ってる時だけ）
    let boost = 0;
    if (touchActive) {
      const dx = touchX - pt.x;
      const dy = touchY - pt.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      const Rb = 130;
      if (d < Rb) boost = 1 - (d / Rb);
    }

    const a = Math.min(0.45, pt.a + boost * 0.28);
    const r = pt.r * (1 + boost * 0.45);

    ctx.beginPath();
    ctx.fillStyle=`rgba(170,210,255,${a})`;
    ctx.ellipse(nx,ny,r,r*1.8,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
}

function burstOut(cx, cy){
  const R = 180;
  const R2 = R*R;
  const power = 1.0;

  for(const pt of particles){
    const dx = pt.x - cx;
    const dy = pt.y - cy;
    const d2 = dx*dx + dy*dy;
    if(d2 > R2) continue;

    const d = Math.sqrt(d2) + 0.0001;
    const falloff = 1 - (d / R);
    const ux = dx / d;
    const uy = dy / d;

    pt.vx += ux * power * falloff;
    pt.vy += uy * power * falloff;
  }
}

// ---- ループ（※1個だけ）
function loop(){
  time += 16;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  drawBackground();

  // 呼吸：7秒 down / 4秒 up（毎フレーム計算する）
  const cycle = 11000;
  const downTime = 7000;
  const t = performance.now() % cycle;

  let p;
  if (t < downTime) p = t / downTime;
  else p = 1 - ((t - downTime) / (cycle - downTime));

  // なめらか
  p = p * p * (3 - 2 * p);

  const maxDepth = 200; // 確認用（落ち着いたら150に戻す）
  offsetY = p * maxDepth;

  // 横揺れ
  const sway =
    Math.sin(time*0.0007)*6 +
    Math.sin(time*0.0013)*2;

  ctx.save();
  ctx.translate(sway, offsetY * 0.4); // 確認用（落ち着いたら0.30へ）
  updateParticles();
  drawParticles();
  ctx.restore();

  requestAnimationFrame(loop);
}

loop(); // ←★これが必要
</script>
</body>
</html>
